target:
  language: C
  mcu: STM32G474RET3
  cubemx_owned_by_user: true
  internal_units: SI
  numeric_strategy: mixed_float_with_optional_cordic
architecture:
  axis_scope: single_reusable_axis_module
  network_mcu_external_protocol: not_fixed
  object_dictionary:
    network_mcu: real_index_subindex_od
    motor_control_mcu: real_index_subindex_od
  inter_mcu:
    transport: SPI
    access: [object_read_write, cyclic_process_data]
    protocol_version: 4                                       # ADR-033/REQ-0013 (3->4; fixed cyclic header gained position_actual + movement_status)
  initial_motor_backend: three_shunt_bldc_pmsm_foc
  future_motor_backend: brushed_dc_hbridge                 # ADR-039 (board profile 1: same .ioc, legs A+B as an H-bridge, leg C off; ADC2 IN6->IN7 so I_A+I_B sensed, i_armature=(I_A-I_B)/2; backend dispatch on backend_type; outer cascade reused). Branch brushed-dc-backend. OPEN: modulation scheme, quadrature encoder, bottom-stroke homing (own ADRs)
feedback:
  initial_position_feedback: configurable_ssi_absolute_encoder
  future_position_feedback: quadrature_encoder
  startup_position: nearest_turn_to_home                    # ADR-037/038 (single-turn encoder: anchor continuous = home + wrap_pi(single-home); re-anchored every cycle while disabled (ADR-038, self-correcting vs the cold-boot home-load race), locked on first enable for multi-turn tracking; no phantom turn near the 0/2pi seam)
  velocity_estimate_default: position_tracking_observer     # ADR-003
  velocity_estimate_fallback: finite_difference_lowpass     # ADR-003
  velocity_estimate_runtime_selectable: true                # ADR-003
loops:
  fast_loop_hz: 20000
  motion_loop_hz: [1000, 2000]
  slow_loop_hz: [10, 100]
trajectory:
  type: jerk_limited_s_curve
  requested_time_important: true
  may_time_stretch: true
  must_report_time_stretched: true
  supports_nonzero_start_velocity_initially: true
  target_velocity_initially_zero: true
control:
  reusable_pid_block: true
  position_controller: configurable_pid_default_p
  velocity_controller: configurable_pid_default_pi
  current_controller: dual_pi_id_iq
  position_execution: realized_d3                          # ADR-028 (trajectory->position->velocity cascade)
  velocity_feedforward_gain: tunable                       # ADR-031 (0x2200:4, default 1.0; FF ratio for position cascade)
  tuning_accel_limit: position_trapezoidal                 # ADR-032 (0x2910:10 test_max_accel; accel-limited position-tuning profile)
  velocity_load_factor: tunable                            # ADR-034/REQ-0014 (0x2300:5, default 1.0, clamp 0.3..2.0; operator load multiplier on vel kp/ki)
command_surface:                                           # PC commands via the CMC axis_manager (0x30xx); INTERFACE_SPEC §5b
  owner: cmc_axis_manager
  modes_working: [off, joystick, profile_velocity, profile_position, hold]   # position exec = ADR-028
  current_command: requested_cmc                           # axis_manager torque mode: Interface/REQUESTS.md REQ-0012 (ADR-027)
loop_tuning:                                               # ADR-030 (motor-side test-signal overlay)
  owner: motor                                             # motor-owned test_mode (0x2910), not a CiA-402 mode
  modes: [off, velocity_tuning, position_tuning]           # overlay on the enabled operational mode
  generator: mc_signal_gen                                 # shared pure module: ramp/pulse/step/continuous (rate=0 -> step)
  injection: {velocity_tuning: velocity_demand, position_tuning: position_demand_bypass_trajectory}
faults:
  severity_based: true
  matrix_required: true
persistence:
  simple_flash_backed_store: true
  fields: [version, crc, defaults, factory_reset]
calibration:                                                 # ADR-026
  od_triggered_commands: [electrical_alignment, set_mechanical_zero, current_offset]  # 0x2700:1 = 1 / 3 / 2
  completeness_reporting: od_bitfield                        # 0x2700:5 cal_done_flags (RO): electrical|mech_zero|current_offset
  completeness_derived_no_store_version_bump: true           # derived from existing state; saved gains survive
  current_offset_requires_power_stage_off: true              # safety gate
tests:
  level: basic_module_tests

# ---- Project direction decisions (see docs/decisions) ----
project_scope:                                              # ADR-001
  build_targets: [motor_control_mcu]
  network_mcu: out_of_scope_separate_project
  inter_mcu_spi_contract: frozen_boundary
  spi_payloads_to_complete: [od_read_resp, od_write_resp, heartbeat, error]
build:                                                      # ADR-002
  migration: clean_room_from_specs
  bringup: incremental_on_target_swd_live_watch
  validation: golden_reference_vs_bldc_axis_controller
  host_tests: optional_unity
hardware:                                                   # ADR-004
  config_model: per_board_profile
  initial_profile: proven_reference_board
  motor_model: runtime_config
board_profile_0:                                            # ADR-004
  current_sense: {shunt_ohm: 0.01, amp_gain: 5.18, zero_offset_v: 1.71, adc_vref_v: 3.3, adc_full_scale: 4096}
  pwm: {frequency_hz: 20000, period_counts: 4250}
  encoder: {backend: ssi, counts_per_rev: 2097152, bits: 21, invert_direction: true}
  values_to_confirm_per_board: [vbus_divider_ratio, deadtime_counts, temp_sense_scaling, phase_current_signs]
motor_model_default:                                        # ADR-004
  part: maxon_500267_ec90_flat
  pole_pairs: 11
  resistance_ohm: 0.844
  inductance_h: 0.00107
  kt_nm_per_a: 0.231
  rotor_inertia_kg_m2: 0.000506
motor_thermal_model:                                        # ADR-065
  model: first_order_i2t                                    # dx/dt = (1/tau)*((I/I_cont)^2 - x); x = utilisation 0..1
  parameters: [i_cont_a, tau_s]                             # only two; steady-state limit + time constant
  sensor: model_only_current_based                          # no temperature sensor at runtime
  over_temp_response: progressive_derate                    # limit mult 1 @x<=0.85 -> 0 @x=1.0
  fault: overtemp_backstop                                  # MC_IF_FAULT_OVERTEMP 0x8 @x>=1.05 (clear 1.0); count 0x2600:14
  od_block: 0x2100                                          # :1 enable :2 i_cont_a :3 tau_s :4 utilisation(RO) :5 derate(RO)
  spec_conversion: pc_tool_calculator                       # continuous -> direct; duty -> tau=t_off/N, I_cont solved
  runtime: slow_loop_100hz                                  # derate applied in od_apply_gains; hard OC trip not derated
  default: disabled                                         # enable=0 -> no derate/fault until configured
low_speed_dither:                                           # ADR-066
  purpose: anti_stiction_stick_slip                         # zero-mean sine current at low speed
  waveform: sine                                            # zero-mean -> no velocity bias
  gate: smooth_speed_fade                                   # fade = clamp((thresh-|v|)/thresh,0,1); no hard on/off
  inject: current_command_after_notch                       # s_iq_cmd_published, bounded by the current limit
  runtime: medium_loop_1khz                                 # freq useful to ~200-300 Hz
  od_block: 0x2320                                          # :1 enable :2 speed_threshold :3 amplitude_a :4 freq_hz :5 output_a(RO)
  default: disabled                                         # enable=0 -> no injection until configured
position_recall:                                            # ADR-067
  purpose: skip_homing_on_non_backdrivable_incremental      # store position after each move; recall on boot instead of NOT_HOMED
  applies_to: incremental_encoder_only                      # absolute (SSI) axes self-locate -> inert
  storage: dedicated_journal                                # POS_RECALL bank2 pg124/125 (4K), separate from config store
  flash_map: linker_named_regions                           # POS_RECALL + CONFIG MEMORY regions; FLASH 474K->470K; app-size cap protects the journal
  bootloader_change: none                                   # image-sized OTA erase + 470K app cap -> update never reaches pg124/125
  record: [seq, position_rad, marker, crc32]                # 16 bytes; highest-seq good-crc authoritative; erase-both-and-restart on wrap
  motion_signal: movement_status_moving                     # reuse MC_IF_MOVE_MOVING; recall adds a ~1 s settle dwell
  store: on_settle_and_change                               # VALID after MOVING clear for the dwell; store-on-change (<1 mrad skip)
  invalidate: on_move_start                                 # INVALID on the MOVING rising edge -> mid-move power loss reverts to NOT_HOMED
  store_gate: enabled_incremental_and_homed                 # never journal an un-homed (meaningless) position as VALID
  write_context: slow_loop_bank2_rww                        # not power-off gated (invalidate fires while moving); bank2 read-while-write
  runtime: slow_loop_100hz                                  # boot recall one-shot in the medium loop before the drive is enabled
  od_entries: [0x2700:11 enable, 0x2700:12 status]          # enable U8 RW PERSIST; status U8 RO 0 off/1 recalled/2 stale/3 none
  default: disabled                                         # enable=0 -> normal homing until configured
current_demand_limit:                                       # ADR-069
  purpose: soft_working_ceiling_below_oc_trip               # saturate at a chosen current instead of tripping the protective OC (0x2600:2)
  quantity: torque_current                                  # clamps iq (FOC) / armature (brushed); ~peak phase when id~0, matching the OC-trip i_max
  clamp_point: current_loop_input_fast_loop                 # bounds every source: velocity/position cascade, torque mode, freq-sweep overlay
  distinct_from: [current_trip_a_0x2600_2, vel_current_limit_a_0x2300_4]  # protective trip (faults); velocity-loop limit (velocity/position only)
  od_entry: 0x2400_8_current_demand_limit_a                 # F32 RW PERSIST; in the current-loop block -> GUI "Current loop gains"
  cross_validation: none                                    # operator sets both; if above the trip it is simply never reached
  default: disabled                                         # 0 = no clamp, no behaviour change until set
position_deadband:                                          # ADR-071
  purpose: park_zone_stop_hold_point_hunting                # no position correction within +/- deadband of target
  form: continuous_subtract_band                            # inside +/-db -> 0; outside -> e-/+db, so correction is continuous at the edge (no step)
  apply_point: position_controller_error_pre_following_clamp # on the loop's error only; raw position_error_rad telemetry unaffected
  affects: hold_not_move                                    # velocity FF dominates during a trajectory; db~mrad vs moves~rad
  od_entry: 0x2200_5_position_deadband_rad                  # F32 RW PERSIST; in the position-loop block -> GUI "Position loop gains"
  rule: keep_below_target_reached_window                    # < 0.01 rad so TARGET_REACHED still reports when parked (not enforced)
  default: disabled                                         # 0 = no deadband, no behaviour change until set
velocity_stop_integrator_bleed:                            # ADR-074
  purpose: anti_recoil_at_end_of_jog                       # stop the velocity PI overshooting zero into a reverse twitch (broadcast)
  cause: integrator_windup_braking_past_zero               # wound-up brake persists past velocity 0 -> reverse; P-only brake doesn't overshoot
  action: fast_unwind_integrator_before_pi                 # integrator -= integrator*clamp(factor*ki*dt,0,1) each tick while armed
  trigger: enabled_and_demand_near_zero_and_low_velocity   # enable && |demand|<1e-3 && |actual|<v_th -> engages on stops, not slow deliberate moves
  scope: self_scoped_by_demand_gate                        # firm on jog stop (demand parks at 0); fleeting on shot-recall (demand goes negative to correct) -> position accuracy kept
  rate_as_factor_of_ki: true                               # 0x2300:12 factor: per-tick fraction = factor*ki*dt (2 = twice as fast); ties bleed to windup timescale, auto-off when ki=0
  od_entries: [0x2300:11 v_th_rad_s, 0x2300:12 factor_x_ki, 0x2300:13 enable_u8]  # F32/F32/U8 RW PERSIST; GUI "Velocity loop gains"
  rejected: [hard_clear_jerks, freeze_keeps_windup, sign_opposition_fires_too_late]
  caveat: gravity_tilt_may_sag_before_hold                 # keep factor modest / rely on CMC HALT-timing (ADR-072)
  default: disabled                                        # enable=0 -> no bleed (v_th/factor default 0.5/1.0 but inert until enabled)
anticipatory_jerk_limited_jog_ramp:                        # ADR-075
  purpose: smooth_jog_ramp_no_accel_discontinuity          # round both ends of the velocity ramp without overshoot/hunting
  problem: adr042_ramp_free_falls_accel                    # jerk-limits accel RISE, free-falls it -> accel discontinuous at the setpoint (settle jerk)
  method: phase_plane_scurve                               # hold accel on a=sqrt(2*jerk*|remaining|) so it eases to 0 as velocity reaches target
  overshoot_guard: hard_backstop_never_crosses_target      # independent of the S-curve math -> tuning error can't overshoot
  live_target: replanned_each_tick                         # moving stick re-tracks jerk-bounded; reversals stay bounded
  od_entry: 0x2300_14_vel_accel_scurve                     # U8 RW PERSIST; reuses vel_accel_jerk (0x2300:8) as the jerk cap
  gui: jog_parameters_section                              # new "Jog parameters" group (0x2300 jog-feel knobs regrouped there)
  reuses_math: mc_traj_scurve_ADR045                       # same S-curve, applied to the streaming velocity command not a planned move
  default: disabled                                        # 0 = ADR-042 free-fall behaviour (opt-in, A/B-able)
